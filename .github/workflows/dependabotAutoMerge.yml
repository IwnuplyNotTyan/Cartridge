name: Dependabot Auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ github.token }}

      - name: Test helper
        run: bash nix/tests/update-vendor-hash-test.sh

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Update vendorHash
        run: ./nix/update-vendor-hash.sh

      - name: Commit hash update
        run: |
          if git diff --quiet -- flake.nix; then
            echo "flake.nix is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "chore(nix): update vendorHash"
          git push

      - name: Auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # The hash commit was pushed with GITHUB_TOKEN, so it has no CI run.
          # Merge the exact commit that was just built. The retry covers the
          # brief UNKNOWN merge state GitHub reports after a push.
          # This assumes main is unprotected; with branch protection, use
          # auto-merge plus a PAT so the bot commit triggers CI.
          head_sha="$(git rev-parse HEAD)"
          for attempt in 1 2 3 4 5; do
            if gh pr merge --merge --match-head-commit "$head_sha" "$PR_URL"; then
              exit 0
            fi
            echo "merge attempt $attempt failed; retrying in 5s" >&2
            sleep 5
          done
          exit 1
